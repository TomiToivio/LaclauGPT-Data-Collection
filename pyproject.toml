[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "laclaugpt-data-collection"
version = "0.1.0"
description = "Public-safe, interoperable data collection for the LaclauGPT ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC0-1.0"}
authors = [{name = "Tomi Toivio"}]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
distributed = [
  "boto3>=1.35,<2",
  "pymongo>=4.9,<5",
  "redis>=5.1,<6",
]
rag = ["neo4j>=5.25,<6"]
feeds = ["feedparser>=6.0,<7"]
browser = ["playwright>=1.47,<2"]
mastodon = ["Mastodon.py>=2.0,<3"]
telegram = ["telethon>=1.36,<2"]
youtube = ["yt-dlp>=2025.1", "youtube-transcript-api>=0.6,<2"]
documents = ["arxiv>=2.1,<3", "pypdf>=5,<7", "PyMuPDF>=1.24,<2"]
x-apify = ["apify-client>=1.8,<3"]
legacy-sources = [
  "Mastodon.py>=2.0,<3",
  "telethon>=1.36,<2",
  "yt-dlp>=2025.1",
  "youtube-transcript-api>=0.6,<2",
  "arxiv>=2.1,<3",
  "pypdf>=5,<7",
  "PyMuPDF>=1.24,<2",
  "apify-client>=1.8,<3",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
laclaugpt-collect = "laclaugpt_data_collection.cli:main"
laclaugpt-config = "laclaugpt_data_collection.config_cli:main"
laclaugpt-redis-config = "laclaugpt_data_collection.redis_config_cli:main"
laclaugpt-capture = "laclaugpt_data_collection.capture_server:main"
laclaugpt-multi-capture = "laclaugpt_data_collection.multi_capture_server:main"
laclaugpt-media-download = "laclaugpt_data_collection.media_runner:main"
laclaugpt-distributed-media = "laclaugpt_data_collection.distributed_media_runner:main"
laclaugpt-handoff = "laclaugpt_data_collection.handoff_runner:main"
laclaugpt-server-rss = "laclaugpt_data_collection.server_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laclaugpt_data_collection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ for the package, repo root so `tests.fixtures` resolves locally even
# when a foreign top-level `tests` package exists in the interpreter's
# site-packages (name shadowing).
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["laclaugpt_data_collection"]
