# AI26 collection codebook
# Sampling taxonomy only. This guides source/query selection and provenance;
# it does not perform discourse analysis or assign ideology to records/actors.

version: ai26-collection-v3
study: ai26
purpose: balanced_collection_discovery
source_of_truth: https://github.com/TomiToivio/LaclauGPT/blob/main/paper/PHASE_1_PAPER.md

principles:
  - formations are provisional sensitising concepts, not fixed actor identities
  - collect claims, articulations and relations across formations rather than classifying by source identity
  - allow documents to be relevant to several formations or none
  - preserve ambiguous and contradictory material for downstream human/theory-guided analysis
  - institutional, corporate, policy, open-source and labour facets are modifiers, not ideological classes
  - source prominence is not evidence of hegemony and source frequency is not ideological importance
  - balance means discursive coverage, not equal quotas for artificially symmetric camps
  - browser targets are bounded sampling strata, not endorsement, opposition or ideological ground truth

arenas:
  elites:
    focus: AI labs, researchers, entrepreneurs, intellectuals and adjacent ideological movements
  grassroots:
    focus: mobilisation around labour, creative work, surveillance, data extraction, environment, data centres and AI risk
  parliamentary:
    focus: parliamentary, electoral, governmental and regulatory discourse about AI

formation_sampling_cues:
  accelerationism:
    discovery_terms: [abundance, growth, innovation, acceleration, progress, AI race, techno-optimism]
    note: Includes e/acc-adjacent and market-oriented techno-optimist material as discovery targets; these traditions are not synonyms.

  existential-risk discourse:
    discovery_terms: [existential risk, extinction, catastrophic risk, loss of control, superintelligence]
    note: '"Doomer" is a situated political label. Prefer x-risk/catastrophic-risk language for neutral retrieval and preserve self-description where available.'

  left-wing techno-optimism:
    discovery_terms: [post-work, automation, public ownership, redistribution, technological emancipation, postcapitalism, public AI, public compute]
    note: Seek technology-positive projects tied to egalitarian, postcapitalist, public-interest or redistributive politics.

  ai safety:
    discovery_terms: [alignment, evaluation, guardrails, pacing, slowdown, standards, incident reporting, audits]
    note: AI-safety discourse is broader than existential-risk discourse and may overlap with accelerationist, institutional or critical positions.

  ai critical:
    discovery_terms: [power, labour, inequality, discrimination, surveillance, extraction, ownership, corporate concentration, hype]
    note: Includes Critical AI and adjacent political-economy/accountability critique without assuming a single unified doctrine.

  anti-ai and deployment resistance:
    discovery_terms: [pause, ban, resistance, job displacement, creator rights, data centre opposition, refusal]
    note: Opposition to a specific deployment must not automatically be treated as opposition to AI in general.

