  - surveillance
  - copyright
  - democratic_control
  - public_interest_ai
  - anti_hype
  - compute_governance
  - military_use
  - automated_decision_making

current_watch_relations:
  - [AI safety, pacing]
  - [AI safety, independent evaluation]
  - [AI safety, incident reporting]
  - [innovation, competition]
  - [AI race, China]
  - [regulation, liability]
