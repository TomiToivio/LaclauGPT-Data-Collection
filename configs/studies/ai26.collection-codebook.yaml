  - acceleration_and_techno_optimism
  - xrisk_and_catastrophic_risk
  - safety_alignment_and_pacing
  - critical_ai_and_political_economy
  - labour_and_creator_rights
  - anti_ai_or_deployment_resistance
  - public_interest_or_left_techno_optimism
  - parliamentary_and_regulatory_governance
  - open_source_open_weights

browser_sampling:
  purpose: bounded_realtime_public_discourse_sample
  primary_platform: x
  method: firefox_profile_tour_plus_graphql_capture
  target_mix:
    - frontier labs and industry
    - techno-optimist and acceleration-adjacent voices
    - existential-risk and AI-safety voices
    - Critical AI and political-economy voices
    - labour and creator-rights organisations
    - pause or deployment-resistance mobilisation
    - public governance institutions
  rules:
    - keep the public X tour small enough for a researcher laptop and ordinary network connection
    - prefer public profiles with sustained AI discourse over broad celebrity or news accounts
    - include institutions as well as individuals so collection does not reduce politics to personalities
    - do not infer formation membership from inclusion in a browser group
    - periodically verify handles because platform usernames can change
    - preserve quote and reply context when available because articulation depends on relational context
    - do not treat post counts as measurements of ideological strength without a separate sampling analysis

collection_boundary:
  allowed:
    - source discovery
    - query construction
    - balanced sampling
    - arena metadata
    - source-family provenance
    - public source-list maintenance
    - bounded current-event vocabulary updates
  forbidden:
    - assigning a formation from actor identity alone
    - treating source_family as ideological ground truth
    - running Laclau/Mouffe/Palonen interpretation in Collection
    - inferring an Us/Frontier relation from sentiment or polarity
    - copying private target lists, corpus-derived labels, credentials or secrets into exported provenance
