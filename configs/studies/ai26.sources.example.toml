# Public-safe AI26 source-family manifest.
# Adapted from the private study configuration and updated for the public paper
# and September 2026 situation. These entries document reproducible sampling
# logic; source_family is a sensitising sampling heuristic, NEVER ideological
# ground truth for individual documents or actors.
#
# Verify URLs before production runs. Operational watch lists, credentials,
# cookies, private endpoints and collection state belong in ignored runtime data.

[[feed]]
name = "lesswrong_frontpage"
feed_url = "https://www.lesswrong.com/feed.xml?view=frontpage"
homepage = "https://www.lesswrong.com"
source_family = "x-risk / rationalist / alignment"
sampling_rationale = "Public essays on existential risk, alignment, decision theory and adjacent AGI imaginaries."
priority = "P1"

