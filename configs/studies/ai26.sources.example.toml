# Public-safe, deliberately bounded AI26 source-family manifest.
# Sources are selected to expose contrasting AI imaginaries and arenas, not to
# pre-classify every document or actor ideologically. Private runtime configs
# may extend this list without changing the public methodology.

[[feed]]
name = "lesswrong_frontpage"
feed_url = "https://www.lesswrong.com/feed.xml?view=frontpage"
homepage = "https://www.lesswrong.com"
arena = "elites"
source_family = "existential-risk / rationalist / alignment"
sampling_rationale = "Public essays on alignment, x-risk and adjacent AGI imaginaries."
priority = "P1"

