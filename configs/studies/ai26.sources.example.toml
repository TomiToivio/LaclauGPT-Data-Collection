# Public, bounded AI26 source manifest for the reference case.
# Inclusion is a sampling decision, not an ideological classification.
# `source_family` explains why material is sampled and MUST NOT be copied into
# analysis as ground-truth ideology.
#
# RSS/Atom entries are executable by the server collector. X account entries
# mirror the browser-tour strata in ai26.example.yaml and are intentionally
# bounded. Runtime configuration may extend this manifest privately.

# ---------------------------------------------------------------------------
# RSS / Atom backbone
# ---------------------------------------------------------------------------

