# These are reproducibility anchors for downstream Analysis, never labels that
# Collection assigns to people, organizations or posts.
formation_vocabulary:
  - accelerationism
  - doomerism
  - left-wing accelerationism
  - ai safety
  - ai critical
  - anti-ai

collection_policy:
  preserve_exact_raw_payload: true
  preserve_source_url: true
  preserve_native_ids: true
  download_public_media_only_when_permitted: true
  publication_date_floor: 2026-09-01
  source_publication_time_required_for_analysis: true
  attach_project_metadata:
    project: ai26
    collection_id: ai26
    arena_from_collection_job: true
  unified_arenas: true
  infer_ideology_during_collection: false
  fetch_external_links_as_web_sources: true
  web_source_type: WEB
  link_fetch_failure_blocks_parent: false
  attachments:
    near_real_time: true
    include: [image, video, audio, pdf, public_document]
    youtube_transcript_only_by_default: true

# Runtime budgets are guardrails for a laptop/small server, not scientific
# quotas. Agents may lower them when backlog/CPU/storage pressure grows.
source_budgets:
  rss_web:
    target_endpoints: 100
    daily_relevant_items_soft_cap: 400
    downstream_priority: 1
  scholarly:
    daily_candidate_cap: 50
    daily_full_analysis_target: 20
    downstream_priority: 1
  youtube:
    target_channels: 20
    daily_transcript_cap: 10
    download_media: false
    downstream_priority: 1
  bluesky:
    target_accounts: 20
    daily_record_cap: 150
    downstream_priority: 2
  mastodon:
    target_accounts: 15
    daily_record_cap: 100
    downstream_priority: 2
  x:
    target_accounts: 35
    daily_record_cap: 300
    per_target_per_poll_cap: 5
    downstream_priority: 3

analysis_handoff:
  ordering:
    - source_priority_ascending
    - source_publication_time_descending
    - canonical_source_id_ascending
  x_last: true
  newly_downloaded_assets_immediately_ready: true

scholarly_discovery:
  services: [arxiv, openalex, semantic_scholar, acl_anthology, socarxiv, osf, ssrn]
  arxiv_categories: [cs.AI, cs.LG, cs.CL, cs.CY, cs.HC, stat.ML]
  public_pdf_download_when_permitted: true

# Platform entries are examples of enabled source families. Real account/feed
# handles are curated by the AI26 agent prompt and may live in ignored runtime
# configuration when operations need to diverge from publication examples.
platforms:
  x:
    enabled: true
    base_urls: ["https://x.com/{handle}"]
  bluesky:
    enabled: true
    base_urls: ["https://bsky.app/profile/{handle}"]
  mastodon:
    enabled: true
  youtube:
    enabled: true
    transcripts_only: true
  rss:
    enabled: true
  web:
    enabled: true
  scholarly:
    enabled: true
  tiktok:
    enabled: true
    base_urls: ["https://www.tiktok.com/@{handle}"]
  instagram:
    enabled: true
    base_urls: ["https://www.instagram.com/{handle}/"]

# Tiny executable fixtures remain synthetic so public tests do not become the
# operational watch list.
groups:
  - id: example_ai_labs
    name: Example AI labs fixture
    arena: elites
    formation_seed: ""
    accounts:
      x: [example_ai_lab]
      tiktok: [example_ai_lab]
      instagram: [example_ai_lab]
  - id: example_civil_society
    name: Example civil society fixture
    arena: grassroots
    formation_seed: ""
    accounts:
      x: [example_civic_group]
      tiktok: [example_civic_group]
      instagram: [example_civic_group]

# Local/distributed backends are configured separately. Values here are
# intentionally non-secret and backend-neutral.
storage:
  canonical_records: configured_runtime_backend
  raw_media: configured_runtime_object_store
  redis_required: false
