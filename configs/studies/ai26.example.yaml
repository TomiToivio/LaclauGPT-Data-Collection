# Public AI26 reference study.
# Publication-facing methodology plus a bounded public demo source plan.
# Credentials, cookies, browser profiles, private endpoints, unpublished
# annotations and machine-specific secrets stay outside Git.

study: ai26
title: Ideological contestation over AI
timezone: UTC
reference_case: true
paper: https://github.com/TomiToivio/LaclauGPT/blob/main/paper/PAPER.md
collection_codebook: ai26.collection-codebook.yaml
source_manifest: ai26.sources.example.toml

distributed:
  config_backend: redis
  messaging_backend: none
  task_queue_backend: direct
  durable_config_snapshot: true
  redis_url_from_environment: LACLAUGPT_REDIS_URL

window:
  start: 2026-09-01
  end: 2026-12-31
  timestamp_basis: source_publication_time
  missing_publication_time: retain_but_mark_unresolved

relevance:
  mode: retain_unjudged

arenas:
  elites:
    title: AI elites
    languages: [en]
    regions: [GLOBAL, US, EU, FI]
    platforms: [rss, web, youtube, x, bluesky, mastodon, scholarly]
    sampling_focus:
      - frontier-lab and industry discourse
      - accelerationism and techno-optimism
      - existential-risk and catastrophic-risk discourse
      - AI safety, alignment, evaluation and pacing
      - Critical AI and political-economy critique
      - open-source, open-weights and public-interest alternatives
      - left-wing and postcapitalist techno-optimism

  grassroots:
    title: Grassroots mobilisation around and against AI
    languages: [en, fi]
    regions: [GLOBAL, FI, EU, US]
    platforms: [rss, web, youtube, x, bluesky, mastodon, tiktok, instagram]
    sampling_focus:
      - labour and automation
      - creative work and copyright
      - surveillance and data extraction
      - data centres, energy and environmental conflict
      - pause/safety mobilisation and opposition to particular AI deployments
      - public-interest and emancipatory uses of automation

  parliamentary:
    title: Parliamentary and electoral politics
    languages: [en, fi]
    regions: [FI, EU, US, GLOBAL]
    platforms: [rss, web, youtube, x, bluesky, mastodon]
    sampling_focus:
      - regulation and public oversight
      - innovation, competitiveness and the AI race
      - national security and geopolitical competition
      - labour, rights and public-interest AI
      - safety standards, liability and independent evaluation

# Sampling anchors only. The paper treats these as provisional formations,
# not actor identities or labels to stamp onto documents during collection.
formation_vocabulary:
  - accelerationism
  - techno-optimism
  - existential-risk discourse
  - ai safety
  - ai critical
  - anti-ai and deployment resistance
  - left-wing techno-optimism

sampling_dimensions:
  political_economy: [ownership, labour, concentration, redistribution, public infrastructure]
  governance: [regulation, liability, audits, standards, democratic control]
  capability_risk: [alignment, catastrophic risk, existential risk, loss of control, autonomous agents]
  techno_optimism: [abundance, growth, innovation, human flourishing, post-work]
  rights_and_harms: [discrimination, surveillance, copyright, creator rights, data extraction]
  infrastructure: [compute, data centres, energy, water, chips, open weights]
  geopolitics: [AI race, China, sovereignty, national security, export controls]

discovery_hints:
  signifiers:
    - artificial intelligence
    - AI
    - AGI
    - frontier AI
    - superintelligence
    - abundance
    - growth
    - innovation
    - progress
    - existential risk
    - catastrophic risk
    - extinction
    - alignment
    - AI safety
    - pacing
    - slowdown
    - pause
    - independent evaluation
    - regulation
    - liability
    - competition
    - AI race
    - sovereignty
    - China
    - labour
    - automation
    - post-work
    - ownership
    - redistribution
    - corporate concentration
    - surveillance
    - copyright
    - creator rights
    - data centres
    - public interest AI
    - democratic AI
    - open source
    - open weights

collection_policy:
  preserve_exact_raw_payload: true
  preserve_source_url: true
  preserve_native_ids: true
  publication_date_floor: 2026-09-01
  source_publication_time_required_for_analysis: true
  infer_ideology_during_collection: false
  fetch_external_links_as_web_sources: true
  web_source_type: WEB
  link_fetch_failure_blocks_parent: false
  youtube_transcript_only_by_default: true
  preserve_quote_reply_context_when_relevant: true
  deduplicate_by_native_id_and_canonical_url: true

collector_defaults:
  retry:
    max_attempts: 3
    initial_backoff_seconds: 2
    max_backoff_seconds: 30
  pagination:
    max_pages_per_poll: 3
  checkpoint:
    enabled: true
    resume: true
  rate_limit:
    respect_retry_after: true
    min_delay_seconds: 1

# Conservative public-demo budgets. RSS/web/scholarly material remains the
# backbone; browser collection is a bounded discourse sample, not a firehose.
source_budgets:
  rss_web:
    target_endpoints: 40
    daily_relevant_items_soft_cap: 240
  scholarly:
    daily_candidate_cap: 40
    daily_full_analysis_target: 15
  youtube:
    target_channels: 15
    daily_transcript_cap: 8
    download_media: false
  bluesky:
    target_accounts: 12
    daily_record_cap: 100
  mastodon:
    target_accounts: 10
    daily_record_cap: 75
  x:
    # Soft maximum, not a literal target: the explicit groups[].accounts.x
    # list currently names 23 handles. Do not expand the list merely to hit a
    # number; keep this at or above the explicit count.
    target_accounts_soft_cap: 28
    explicit_target_count: 23
    daily_record_cap: 240
    per_target_per_poll_cap: 4
    browser_profile_visits_per_cycle: 1
    sampling_mode: bounded_profile_tour

platforms:
  rss: {enabled: true}
  web: {enabled: true}
  scholarly: {enabled: true}
  youtube: {enabled: true, transcripts_only: true}
  x:
    enabled: true
    base_urls: ["https://x.com/{handle}"]
    collection_mode: firefox_browser_graphql_capture
    note: "The Firefox /tour endpoint expands every configured groups.accounts.x handle into a profile visit. Keep this list bounded."
  bluesky: {enabled: true, base_urls: ["https://bsky.app/profile/{handle}"]}
  # NOTE: tour_accounts() emits a row for every enabled platform but only
  # substitutes {handle}; a platform with no base_urls yields url="". Mastodon
  # handles are "@user@instance" so a simple {handle} template cannot express
  # the profile URL. Mastodon rows therefore currently carry an empty URL in
  # /tour. Tracked as a known limitation until the browser tour gains
  # platform-specific URL building.
  mastodon: {enabled: true}
  tiktok: {enabled: false, note: "optional later grassroots extension"}
  instagram: {enabled: false, note: "optional later grassroots extension"}

# Public browser targets. Inclusion is a sampling decision, NEVER an
# ideological classification of an actor. Groups describe why material is
# useful for collection coverage. Downstream analysis must infer positions
# from documents and relations, not from source identity.
groups:
  - id: frontier_labs_x
    name: Frontier labs and AI industry
    arena: elites
    notes: capability, deployment, competition, safety, infrastructure and growth discourse
    accounts:
      x: [OpenAI, AnthropicAI, GoogleDeepMind, MetaAI, NVIDIAAI]

  - id: techno_optimism_x
    name: Techno-optimist and acceleration-adjacent discourse
    arena: elites
    notes: growth, abundance, acceleration, progress and human-flourishing articulations; do not treat these traditions as synonymous
    accounts:
      x: [pmarca, ylecun, sama]

  - id: xrisk_safety_x
    name: Existential-risk and AI-safety discourse
    arena: elites
    notes: catastrophic risk, alignment, loss of control, evaluation and pacing; "doomer" remains a situated label rather than collection metadata
    accounts:
      x: [ESYudkowsky, MIRI_AI, FLI_org]

  - id: critical_ai_x
    name: Critical AI and political economy
    arena: elites
    notes: power, labour, inequality, discrimination, surveillance, extraction, concentration and hype critique; institutional accounts broaden the stratum without treating source identity as ideology
    accounts:
      x: [timnitGebru, emilymbender, AINowInstitute, AdaLovelaceInst]
      bluesky: [timnitgebru.blacksky.app, emilymbender.bsky.social]
      mastodon: ["@TimnitGebru@mastodon.social", "@emilymbender@dair-community.social"]

  - id: grassroots_labour_creator_x
    name: Labour and creator-rights mobilisation
    arena: grassroots
    notes: employment, automation, copyright, consent and bargaining around generative AI
    accounts:
      x: [sagaftra, WGAWest, uniglobalunion]

  - id: grassroots_pause_resistance_x
    name: Pause and deployment-resistance mobilisation
    arena: grassroots
    notes: collective mobilisation around slowing, pausing or resisting particular AI deployments
    accounts:
      x: [PauseAI]

  - id: governance_institutions_x
    name: Public governance institutions
    arena: parliamentary
    notes: regulation, standards, oversight, competitiveness and public policy; institutional accounts reduce party-political sampling bias in the public demo
    accounts:
      x: [EU_Commission, Europarl_EN, OECD_AI, NIST]
    discovery_entities:
      - European Commission AI Office
      - European Parliament
      - Finnish Government
      - Parliament of Finland
      - Ministry of Economic Affairs and Employment of Finland
      - OECD.AI
      - US National Institute of Standards and Technology

  - id: left_techno_optimism_discovery
    name: Public-interest and left techno-optimism discovery
    arena: elites
    notes: retain as an explicit discovery stratum so technology-positive egalitarian/post-work articulations are not collapsed into market accelerationism; deliberately use discovery terms and long-form sources rather than pre-assigning individual accounts
    discovery_terms: [post-work, postcapitalism, public AI, public compute, democratic AI, automation dividend, technological emancipation]
    discovery_entities:
      - Public AI Network
      - Ada Lovelace Institute

storage:
  canonical_records: configured_runtime_backend
  raw_media: configured_runtime_object_store
  redis_required: false
