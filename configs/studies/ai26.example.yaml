# Public AI26 reference study.
# This file intentionally exposes publication-facing methodology and a bounded
# public target strategy. It is not a credentials/runtime-secrets file.
# Never commit cookies, browser profiles, private backend URLs, row-level data,
# machine-specific secrets, or unpublished researcher annotations.

study: ai26
title: Ideological contestation over AI
timezone: UTC
reference_case: true
paper: https://github.com/TomiToivio/LaclauGPT/blob/main/paper/PAPER.md
collection_agent_prompt: ../../docs/agents/AI26_COLLECTION_TARGETS_AGENT.md

# AI26 is currently a near-real-time study. Source publication time, rather
# than collection time, controls eligibility for downstream analysis.
window:
  start: 2026-09-01
  end: 2026-12-31
  timestamp_basis: source_publication_time
  missing_publication_time: retain_but_mark_unresolved

relevance:
  # Preserve uncertain material for later human/theory-guided assessment.
  mode: retain_unjudged

# Arenas mirror the paper but are dimensions of one AI26 dataset/run, not
# separate databases or dashboards.
arenas:
  elites:
    title: AI elites
    platforms: [web, rss, youtube, x, bluesky, mastodon, scholarly]
    languages: [en]
    regions: [GLOBAL, US, EU, FI]
    description: >-
      Entrepreneurs, researchers, intellectuals, major AI labs and adjacent
      ideological movements. Prefer substantive public blogs, statements,
      interviews, transcripts, papers and bounded social-media samples.
    public_source_examples:
      - https://openai.com/
      - https://www.anthropic.com/
      - https://deepmind.google/
      - https://ai.meta.com/
      - https://www.nvidia.com/
      - https://www.miri.org/
      - https://www.dair-institute.org/
      - https://www.ainowinstitute.org/
      - https://www.lesswrong.com/
      - https://www.alignmentforum.org/

  grassroots:
    title: Grassroots mobilisation around and against AI
    platforms: [web, rss, youtube, x, bluesky, mastodon, tiktok, instagram]
    languages: [en, fi]
    regions: [GLOBAL, FI, EU, US]
    description: >-
      Public mobilisation and conflict around employment, creative work,
      surveillance, data extraction, data centres, environment, regulation,
      AI safety, creator rights, labour, local resistance and broader
      support/opposition to AI.
    public_source_examples:
      - https://pauseai.info/
      - https://www.eff.org/
      - https://www.sagaftra.org/
      - https://aflcio.org/
      - https://www.uniglobalunion.org/
      - https://www.sak.fi/
      - https://www.sttk.fi/
      - https://akava.fi/

  parliamentary:
    title: Parliamentary and electoral politics
    platforms: [web, rss, youtube, x, bluesky, mastodon]
    languages: [en, fi]
    regions: [FI, EU, US, GLOBAL]
    description: >-
      AI-related parliamentary debates, policy documents, election material,
      party/government discourse and institutional AI governance. Prefer
      institutional/keyword collection over selective partisan watch lists.
    public_source_examples:
      - https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
      - https://www.europarl.europa.eu/
      - https://www.eduskunta.fi/
      - https://valtioneuvosto.fi/
      - https://www.oecd.ai/

