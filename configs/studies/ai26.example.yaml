# Public AI26 reference study.
# Publication-facing methodology and bounded sampling logic only.
# Operational credentials, cookies, browser profiles, private endpoints,
# unpublished annotations and machine-specific secrets stay outside Git.

study: ai26
title: Ideological contestation over AI
timezone: UTC
reference_case: true
paper: https://github.com/TomiToivio/LaclauGPT/blob/main/paper/PAPER.md
collection_codebook: ai26.collection-codebook.yaml
source_manifest: ai26.sources.example.toml

# Distributed control-plane policy for the current AI26 collection deployment.
# Centralized Redis-backed project configuration is enabled conceptually now so
# laptop/browser and server collectors can consume the same validated settings.
# Messaging/events and distributed task queueing are implemented by the module
# but intentionally remain inactive for AI26 until there is an operational need.
distributed:
  config_backend: redis
  messaging_backend: none
  task_queue_backend: direct
  durable_config_snapshot: true
  redis_url_from_environment: LACLAUGPT_REDIS_URL

window:
  start: 2026-09-01
  end: 2026-12-31
  timestamp_basis: source_publication_time
  missing_publication_time: retain_but_mark_unresolved

relevance:
  # Preserve ambiguous material for later human/theory-guided assessment.
  mode: retain_unjudged

# These are the three empirical arenas in the paper. They are dimensions of one
# AI26 dataset, not separate databases or ideological classes.
arenas:
  elites:
    title: AI elites
    languages: [en]
    regions: [GLOBAL, US, EU, FI]
    platforms: [rss, web, youtube, x, bluesky, mastodon, scholarly]
    sampling_focus:
      - frontier-lab and industry discourse
      - acceleration and techno-optimism
      - existential-risk and alignment discourse
      - AI safety, evaluation and pacing
      - Critical AI and political-economy critique

  grassroots:
    title: Grassroots mobilisation around and against AI
    languages: [en, fi]
    regions: [GLOBAL, FI, EU, US]
    platforms: [rss, web, youtube, x, bluesky, mastodon, tiktok, instagram]
    sampling_focus:
      - labour and automation
      - creative work and copyright
      - surveillance and data extraction
      - data centres, energy and environmental conflict
      - pause/safety mobilisation and broader opposition to AI deployments

  parliamentary:
    title: Parliamentary and electoral politics
    languages: [en, fi]
    regions: [FI, EU, US, GLOBAL]
    platforms: [rss, web, youtube, x, bluesky, mastodon]
    sampling_focus:
      - regulation and public oversight
      - innovation, competitiveness and the AI race
      - national security and China
      - labour, rights and public-interest AI
      - safety standards, liability and independent evaluation

# Canonical aggregation vocabulary from the paper/private AI26 pipeline.
# Collection NEVER assigns these labels to records. They are sampling anchors
# for balanced discovery; document-level interpretation belongs to Analysis.
formation_vocabulary:
  - accelerationism
  - doomerism
  - left-wing accelerationism
  - ai safety
  - ai critical
  - anti-ai

# Small discovery vocabulary reflecting the paper and the September 2026
# pacing/safety/competition controversy. These are query/source-discovery terms,
# not a keyword classifier.
discovery_hints:
  signifiers:
    - artificial intelligence
    - AGI
    - superintelligence
    - abundance
    - growth
    - innovation
    - existential risk
    - catastrophic risk
    - alignment
    - AI safety
    - pacing
    - slowdown
    - pause
    - independent evaluation
    - regulation
    - liability
    - competition
    - AI race
    - China
    - labour
    - automation
    - ownership
    - corporate concentration
    - surveillance
    - copyright
    - data centres
    - public interest AI
    - democracy

collection_policy:
  preserve_exact_raw_payload: true
  preserve_source_url: true
  preserve_native_ids: true
  publication_date_floor: 2026-09-01
  source_publication_time_required_for_analysis: true
  infer_ideology_during_collection: false
  fetch_external_links_as_web_sources: true
  web_source_type: WEB
  link_fetch_failure_blocks_parent: false
  youtube_transcript_only_by_default: true

# Conservative defaults for a laptop/small Linux server. These are guardrails,
# not scientific quotas. Private runtime config may lower them further.
collector_defaults:
  retry:
    max_attempts: 3
    initial_backoff_seconds: 2
    max_backoff_seconds: 30
  pagination:
    max_pages_per_poll: 3
  checkpoint:
    enabled: true
    resume: true
  rate_limit:
    respect_retry_after: true
    min_delay_seconds: 1

source_budgets:
  rss_web:
    target_endpoints: 30
    daily_relevant_items_soft_cap: 180
  scholarly:
    daily_candidate_cap: 30
    daily_full_analysis_target: 12
  youtube:
    target_channels: 12
    daily_transcript_cap: 8
    download_media: false
  bluesky:
    target_accounts: 12
    daily_record_cap: 80
  mastodon:
    target_accounts: 10
    daily_record_cap: 60
  x:
    target_accounts: 24
    daily_record_cap: 180
    per_target_per_poll_cap: 4

platforms:
  rss: {enabled: true}
  web: {enabled: true}
  scholarly: {enabled: true}
  youtube: {enabled: true, transcripts_only: true}
  x: {enabled: true, base_urls: ["https://x.com/{handle}"]}
  bluesky: {enabled: true, base_urls: ["https://bsky.app/profile/{handle}"]}
  mastodon: {enabled: true}
  tiktok: {enabled: true, base_urls: ["https://www.tiktok.com/@{handle}"]}
  instagram: {enabled: true, base_urls: ["https://www.instagram.com/{handle}/"]}

# Synthetic executable fixtures only. Real operational source lists may extend
# this through private runtime configuration.
groups:
  - id: example_ai_elite
    name: Example AI elite fixture
    arena: elites
    accounts:
      x: [example_ai_researcher]
  - id: example_grassroots
    name: Example grassroots fixture
    arena: grassroots
    accounts:
      x: [example_civic_group]

storage:
  canonical_records: configured_runtime_backend
  raw_media: configured_runtime_object_store
  redis_required: false
