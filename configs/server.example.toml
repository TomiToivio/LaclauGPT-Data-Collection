profile = "linux-server-distributed"
machine = "linux-server"
execution = "cron"
browser = "none"

[storage]
records = "mongodb"
objects = "s3"
cache = "redis"

[paths]
data_root = "./data"

[collector]
mode = "distributed"
workers = 4
download_media = true

[mongodb]
uri_env = "LACLAUGPT_MONGODB_URI"
database_env = "LACLAUGPT_MONGODB_DATABASE"

[redis]
url_env = "LACLAUGPT_REDIS_URL"

[s3]
endpoint_url_env = "LACLAUGPT_S3_ENDPOINT_URL"
region_env = "LACLAUGPT_S3_REGION"
bucket_env = "LACLAUGPT_S3_BUCKET"
access_key_id_env = "LACLAUGPT_S3_ACCESS_KEY_ID"
secret_access_key_env = "LACLAUGPT_S3_SECRET_ACCESS_KEY"

[interoperability]
schema_version = "1.0.0"
emit_jsonl = true
emit_csv = true
