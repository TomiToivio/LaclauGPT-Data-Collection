profile = "laptop-firefox-local"
machine = "laptop"
execution = "cli"
browser = "firefox-local"

[storage]
records = "sqlite"
objects = "filesystem"
cache = "memory"

[paths]
data_root = "./data"
sqlite_path = "./data/database/collection.sqlite3"

[browser_capture]
host = "127.0.0.1"
port = 8765

[collector]
mode = "local"
workers = 1

[interoperability]
schema_version = "1.1.0"
emit_jsonl = true
emit_csv = true
